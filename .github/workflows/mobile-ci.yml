name: Mobile CI

# mew_voice is an independent Expo project.
# 개발 중에는 자동으로 돌리지 않는다. Actions에서 workflow_dispatch로만 수동 실행한다.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # postinstall builds the bundled shared contract.
      - name: 모바일 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 타입체크
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 단위 테스트
        run: npm test

      - name: Android 프로덕션 번들
        run: npm run export:android
